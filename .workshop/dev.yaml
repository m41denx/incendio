name: dev
base: ubuntu@24.04

sdks:
- name: project-run-lxd-ui
  slots:
    vite-dev-server:
      interface: tunnel
      endpoint: localhost:8407        # service in the workshop
- name: system
  plugs:
    vite-dev-server:
      interface: tunnel
      endpoint: localhost:8407        # port on the host

actions:
  install: source /home/workshop/.nvm/nvm.sh && bun install
  lint: source /home/workshop/.nvm/nvm.sh && bun run lint-js && bun run lint-scss
  serve: source /home/workshop/.nvm/nvm.sh && bun install && bun run start
  test-js: source /home/workshop/.nvm/nvm.sh && bun run test-js
