name: PR lint (k8s agent)

# Lints and test-builds the @incendio/k8s package on pull requests that touch it.
on:
  pull_request:
    paths:
      - "packages/k8s/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pr-lint-k8s.yaml"

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (tsc)
        run: bun run --filter '@incendio/k8s' lint

      - name: Test build
        run: bun run --filter '@incendio/k8s' build
