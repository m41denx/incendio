{{- include "incuscloud.required" . -}}
{{- $name := include "incuscloud.fullname" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $keep := dict -}}
{{- range $k := list "secret-key" "admin-password" "openfga-key" "hydra-secret" "postgres-password" "hydra-db-password" "openfga-db-password" "incuscloud-db-password" -}}
{{- if hasKey $old $k -}}{{- $_ := set $keep $k (index $old $k | b64dec) -}}{{- else -}}{{- $_ := set $keep $k (randAlphaNum 32) -}}{{- end -}}
{{- end -}}
{{- if .Values.secretKey -}}{{- $_ := set $keep "secret-key" .Values.secretKey -}}
{{- else if not (hasKey $old "secret-key") -}}{{- $_ := set $keep "secret-key" (randAlphaNum 48 | b64enc) -}}{{- end -}}
{{- if .Values.admin.password -}}{{- $_ := set $keep "admin-password" .Values.admin.password -}}{{- end -}}
{{- $pg := include "incuscloud.postgresHost" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "incuscloud.labels" . | nindent 4 }}
  annotations:
    # Generated values must survive an uninstall by mistake: losing secret-key loses every enrolled cluster.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := $keep }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  incuscloud-url: {{ printf "postgres://incuscloud:%s@%s:5432/incuscloud" (index $keep "incuscloud-db-password") $pg | quote }}
  hydra-dsn: {{ printf "postgres://hydra:%s@%s:5432/hydra?sslmode=disable" (index $keep "hydra-db-password") $pg | quote }}
  openfga-uri: {{ printf "postgres://openfga:%s@%s:5432/openfga?sslmode=disable" (index $keep "openfga-db-password") $pg | quote }}
  {{- end }}
