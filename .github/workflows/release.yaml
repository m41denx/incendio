name: Release UI bundle

# Releases are cut by pushing a tag (e.g. `0.22-p6`), not on every branch push,
# so routine commits/bugfixes don't create releases.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the build can stamp the short git hash.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        run: bun run build

      - name: Prepare release notes
        id: version
        run: |
          version="${GITHUB_REF_NAME}"
          # Extract this version's section from CHANGELOG.md: from its
          # `## <version>` heading up to (excluding) the next version heading
          # (## <digit>...). "## What's Changed" / "### ..." sub-headings stay.
          awk -v ver="## ${version}" '
            $0 == ver { f = 1; print; next }
            f && /^## [0-9]/ { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section for ${version}; using the tag name only." >&2
            printf '## %s\n' "$version" > RELEASE_NOTES.md
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Package UI bundle
        run: |
          cd packages/ui/build/ui
          zip -r "${GITHUB_WORKSPACE}/incendio-ui-${{ steps.version.outputs.version }}.zip" .

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: incendio-ui-${{ steps.version.outputs.version }}.zip
