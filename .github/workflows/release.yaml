name: Release UI bundle

on:
  push:
    branches:
      - incus-port

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the build can stamp the short git hash.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build UI
        run: yarn build

      - name: Prepare release version and notes
        id: version
        run: |
          # The first "## " heading is the current version (## 0.22-p6).
          version="$(grep -m1 '^## ' CHANGELOG.md | sed 's/^##[[:space:]]*//')"
          if [ -z "$version" ]; then
            echo "No version heading found in CHANGELOG.md" >&2
            exit 1
          fi
          # Extract only this version's section: from the first version heading
          # (## <digit>...) up to, but excluding, the next version heading.
          # "## What's Changed" / "### ..." sub-headings are kept.
          awk '/^## [0-9]/ { c++; if (c == 2) exit } c >= 1' CHANGELOG.md > RELEASE_NOTES.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Package UI bundle
        run: |
          cd build/ui
          zip -r "../../incendio-ui-${{ steps.version.outputs.version }}.zip" .

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: incendio-ui-${{ steps.version.outputs.version }}.zip
