{{- if .Values.postgres.enabled }}
{{- $name := include "incuscloud.postgresHost" . -}}
{{- $secret := include "incuscloud.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels: {{- include "incuscloud.labels" . | nindent 4 }}
data:
  10-databases.sh: |
    #!/bin/sh
    # Runs once, on an empty data directory: a database and an owner for each service.
    set -eu
    for svc in hydra openfga incuscloud; do
      pw=$(eval "printf %s \"\$$(echo "$svc" | tr a-z A-Z)_DB_PASSWORD\"")
      psql -v ON_ERROR_STOP=1 -U postgres <<SQL
    CREATE ROLE $svc LOGIN PASSWORD '$pw';
    CREATE DATABASE $svc OWNER $svc;
    SQL
    done
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "incuscloud.labels" . | nindent 4 }}
spec:
  selector: {{- include "incuscloud.selector" (dict "ctx" . "component" "postgres") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "incuscloud.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "incuscloud.selector" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "incuscloud.selector" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: postgres-password } }
            {{- range $svc := list "hydra" "openfga" "incuscloud" }}
            - name: {{ upper $svc }}_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: {{ $svc }}-db-password } }
            {{- end }}
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U postgres -h 127.0.0.1"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: init
          configMap: { name: {{ $name }}-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgres.storageClass }}
        storageClassName: {{ .Values.postgres.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
{{- end }}
