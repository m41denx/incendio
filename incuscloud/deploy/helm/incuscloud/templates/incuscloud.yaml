{{- $name := include "incuscloud.fullname" . -}}
{{- $s := .Values.settings -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "incuscloud.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  selector: {{- include "incuscloud.selector" (dict "ctx" . "component" "server") | nindent 4 }}
  ports:
    - { name: https, port: {{ .Values.service.port }}, targetPort: https }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "incuscloud.labels" . | nindent 4 }}
spec:
  # One replica running every role: migrations run at start-up, and the workers take leases.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "incuscloud.selector" (dict "ctx" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "incuscloud.selector" (dict "ctx" . "component" "server") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: incuscloud
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: IC_ROLE, value: all }
            - { name: IC_PUBLIC_URL, value: "https://{{ .Values.publicHost }}" }
            - { name: IC_CLUSTER_DOMAIN, value: {{ .Values.clusterDomain | quote }} }
            - { name: IC_LISTEN_PORT, value: "8443" }
            - { name: IC_TLS_CERT, value: /certs/public/tls.crt }
            - { name: IC_TLS_KEY, value: /certs/public/tls.key }
            - name: IC_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "incuscloud.dbSecret" . }}, key: incuscloud-url } }
            - name: IC_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ $name }}, key: secret-key } }
            - { name: IC_HYDRA_PUBLIC_URL, value: "https://{{ include "incuscloud.hydraHost" . }}:4444" }
            - { name: IC_HYDRA_ADMIN_URL, value: "https://{{ include "incuscloud.hydraHost" . }}:4445" }
            - { name: IC_HYDRA_CA_FILE, value: /certs/internal/ca.crt }
            - { name: IC_OPENFGA_URL, value: "http://{{ include "incuscloud.openfgaHost" . }}:{{ .Values.openfga.service.port }}" }
            - name: IC_OPENFGA_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $name }}, key: openfga-key } }
            - { name: IC_OPENFGA_CLUSTER_URL, value: {{ .Values.openfga.clusterUrl | quote }} }
            - { name: IC_BOOTSTRAP_ADMIN_EMAIL, value: {{ .Values.admin.email | quote }} }
            - name: IC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $name }}, key: admin-password } }
            - { name: IC_RECONCILE_INTERVAL, value: {{ $s.reconcileInterval | quote }} }
            - { name: IC_INVENTORY_INTERVAL, value: {{ $s.inventoryInterval | quote }} }
            - { name: IC_METRICS_RETENTION, value: {{ $s.metricsRetention | quote }} }
            - { name: IC_JOB_CONCURRENCY, value: {{ $s.jobConcurrency | quote }} }
            - { name: IC_IMAGE_SERVER, value: {{ $s.imageServer | quote }} }
            - { name: IC_LOG_LEVEL, value: {{ $s.logLevel | quote }} }
            {{- if .Values.kubernetes.kubeconfigSecret }}
            - { name: IC_K8S_KUBECONFIG, value: /etc/incuscloud/k8s/kubeconfig }
            - { name: IC_K8S_PORTS, value: {{ .Values.kubernetes.ports | quote }} }
            {{- end }}
            {{- range $k, $v := $s.extraEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          ports:
            - { name: https, containerPort: 8443 }
          readinessProbe:
            tcpSocket: { port: https }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: https }
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - { name: public-tls, mountPath: /certs/public, readOnly: true }
            - { name: internal-ca, mountPath: /certs/internal, readOnly: true }
            {{- if .Values.kubernetes.kubeconfigSecret }}
            - { name: kubeconfig, mountPath: /etc/incuscloud/k8s, readOnly: true }
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: public-tls
          secret:
            secretName: {{ .Values.tls.existingSecret | default (printf "%s-internal-tls" $name) }}
            defaultMode: 0440
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
        - name: internal-ca
          secret:
            secretName: {{ $name }}-internal-tls
            items:
              - { key: ca.crt, path: ca.crt }
        {{- if .Values.kubernetes.kubeconfigSecret }}
        - name: kubeconfig
          secret:
            secretName: {{ .Values.kubernetes.kubeconfigSecret }}
            defaultMode: 0440
            items:
              - { key: kubeconfig, path: kubeconfig }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
